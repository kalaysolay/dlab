# Шаблон nginx для Damulab.kz.
# Скопировать на сервер: /etc/nginx/sites-available/damulab.conf
#   sudo ln -s /etc/nginx/sites-available/damulab.conf /etc/nginx/sites-enabled/
# Это стартовый HTTP-конфиг. Certbot добавит HTTPS и редирект автоматически
# (см. docs/DEPLOY_VPS.md).
#
# Замените damulab.kz на ваш домен, если отличается.

server {
    listen 80;
    listen [::]:80;
    server_name damulab.kz www.damulab.kz;

    client_max_body_size 30m;

    # PWA: manifest и service-worker должны отдаваться с тем же origin, что и страницы
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    3600s;
    }
}
