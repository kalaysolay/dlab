spring:
  datasource:
    url: jdbc:h2:mem:damulab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
damulab:
  ai:
    # V38 выбирает DeepSeek для переводов, но тестовый профиль блокирует любой внешний API.
    real-providers-enabled: false
  testing:
    default-question-count: 12
    max-question-count: 20
    min-published-per-subject-grade: 1
    selection-strategy: adaptive
    recent-session-window: 3
    max-topic-share-percent: 40
    mastery-stale-after-days: 30
  quiz:
    timeout-worker-enabled: false
  subjects:
    icons:
      # Тестовые загрузки не смешиваются с локальными файлами разработчика.
      storage-dir: build/test-subject-icons
