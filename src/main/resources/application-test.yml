spring:
  datasource:
    # PostgreSQL-прогон использует только явно заданную изолированную тестовую БД.
    url: ${QUIZ_TEST_DB_URL:jdbc:h2:mem:damulab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${QUIZ_TEST_DB_DRIVER:org.h2.Driver}
    username: ${QUIZ_TEST_DB_USER:sa}
    password: ${QUIZ_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
damulab:
  ai:
    # V38 выбирает DeepSeek для переводов, но тестовый профиль блокирует любой внешний API.
    real-providers-enabled: false
  testing:
    default-question-count: 12
    max-question-count: 20
    min-published-per-subject-grade: 1
    selection-strategy: adaptive
    recent-session-window: 3
    max-topic-share-percent: 40
    mastery-stale-after-days: 30
  quiz:
    # Регрессия старого портала не зависит от QUIZ_GAME_CATALOG_ENABLED машины разработчика.
    game-catalog-enabled: false
    strict-self-review: false
    timeout-worker-enabled: false
  subjects:
    icons:
      # Тестовые загрузки не смешиваются с локальными файлами разработчика.
      storage-dir: build/test-subject-icons
