<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Слова</title><th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell admin-shell"><main class="page admin-layout">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
<section class="panel quiz-admin-page">
  <div class="page-head"><div><h1 class="page-title">Слова</h1><p class="lede">Ищите слова и переводы, фильтруйте по наборам и управляйте редакциями.</p></div><a class="button primary" th:href="@{/admin/vocabulary/items/new(setId=${selectedSetId})}">Добавить слово</a></div>
  <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  <form class="filter-bar" method="get" th:action="@{/admin/vocabulary/items}"><label class="field compact"><span>Набор</span><select name="setId"><option value="">Любой</option><option th:each="set : ${sets}" th:value="${set.id}" th:selected="${set.id == selectedSetId}" th:text="${set.draftVersion != null ? set.draftVersion.titleRu : (set.publishedVersion != null ? set.publishedVersion.titleRu : set.code)}"></option></select></label><label class="field compact"><span>Язык слова</span><select name="sourceLanguage"><option value="">Любой</option><option value="en" th:selected="${selectedSourceLanguage == 'en'}">en</option><option value="kk" th:selected="${selectedSourceLanguage == 'kk'}">kk</option><option value="ru" th:selected="${selectedSourceLanguage == 'ru'}">ru</option></select></label><label class="field compact"><span>Язык перевода</span><select name="targetLanguage"><option value="">Любой</option><option value="en" th:selected="${selectedTargetLanguage == 'en'}">en</option><option value="ru" th:selected="${selectedTargetLanguage == 'ru'}">ru</option><option value="kk" th:selected="${selectedTargetLanguage == 'kk'}">kk</option></select></label><label class="field compact"><span>Класс</span><select name="gradeId"><option value="">Любой</option><option th:each="grade : ${grades}" th:value="${grade.id}" th:selected="${grade.id == selectedGradeId}" th:text="${grade.titleRu}"></option></select></label><label class="field compact"><span>Сложность</span><select name="difficulty"><option value="">Любая</option><option th:each="level : ${#numbers.sequence(1,5)}" th:value="${level}" th:selected="${level == selectedDifficulty}" th:text="${level}"></option></select></label><label class="field compact"><span>Статус</span><select name="status"><option value="">Любой</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${s}"></option></select></label><label class="field compact"><span>Поиск</span><input name="query" th:value="${query}" placeholder="Слово или перевод"></label><button class="button" type="submit">Показать</button><a class="button" th:href="@{/admin/vocabulary/items}">Сбросить</a></form>
  <form id="bulk-word-submit" method="post" th:action="@{/admin/vocabulary/items/bulk-submit}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form>
  <div class="table-wrap" id="vocabulary-items"><table class="data-table vocabulary-table"><thead><tr><th></th><th>Слово</th><th>Перевод</th><th>Набор</th><th>Статус</th><th>Действия</th></tr></thead><tbody>
  <tr th:each="item : ${items}" th:with="v=${item.draftVersion != null ? item.draftVersion : item.publishedVersion}"><td><input th:if="${item.draftVersion != null and item.draftVersion.status.name() == 'DRAFT'}" form="bulk-word-submit" type="checkbox" name="itemIds" th:value="${item.id}" th:attr="aria-label=${'Выбрать слово ' + item.id}"></td><td><a class="vocabulary-word" data-vocabulary-edit th:href="@{/admin/vocabulary/items/{id}/edit(id=${item.id})}" th:text="${v != null ? v.sourceText : '—'}"></a></td><td th:text="${v != null ? primaryAnswers[v.id] : '—'}"></td><td th:text="${item.set.code}"></td><td><span class="badge" th:text="${item.status}"></span><span class="badge warning" th:if="${item.draftVersion != null and item.publishedVersion != null}" th:text="${'draft v' + item.draftVersion.versionNo}"></span></td><td><div class="row-actions"><a class="button" data-vocabulary-edit th:href="@{/admin/vocabulary/items/{id}/edit(id=${item.id})}">Открыть</a><details class="vocabulary-menu"><summary class="button" th:attr="aria-label=${'Действия со словом ' + (v != null ? v.sourceText : item.id)}">⋯</summary><div class="vocabulary-menu-actions">
    <form th:if="${item.draftVersion != null and item.draftVersion.status.name() == 'NEEDS_REVIEW'}" method="post" th:action="@{/admin/vocabulary/items/{id}/approve(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">Одобрить</button></form>
    <form th:if="${item.draftVersion != null and item.draftVersion.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/vocabulary/items/{id}/publish(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary" type="submit">Опубликовать</button></form>
    <form th:if="${item.status.name() != 'ARCHIVED'}" method="post" th:action="@{/admin/vocabulary/items/{id}/archive(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger" type="submit">Архив</button></form>
  </div></details></div></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="6">Слова не найдены. Измените фильтры или добавьте слово.</td></tr></tbody></table></div><button class="button" type="submit" form="bulk-word-submit">Отправить выбранные на проверку</button>
</section></main></div>
<dialog id="vocabulary-dialog" class="vocabulary-dialog" aria-labelledby="vocabulary-dialog-title">
  <header class="vocabulary-dialog-head">
    <h2 id="vocabulary-dialog-title">Редакция слова</h2>
    <div class="row-actions"><button class="button" type="button" data-vocabulary-prev>Предыдущая</button><span data-vocabulary-position></span><button class="button" type="button" data-vocabulary-next>Следующая</button><button class="button" type="button" data-vocabulary-close aria-label="Закрыть редактор">Закрыть</button></div>
  </header>
  <p class="alert danger" data-vocabulary-error role="alert" hidden></p>
  <div class="vocabulary-dialog-body" data-vocabulary-body aria-live="polite"></div>
  <footer class="vocabulary-dialog-footer" data-vocabulary-footer></footer>
</dialog>
<script defer th:src="@{/js/admin-vocabulary.js}"></script>
</body></html>
