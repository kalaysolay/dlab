<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Банк слов</title><th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell admin-shell"><main class="page admin-layout">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
<section class="panel quiz-admin-page">
  <div class="page-head"><div><h1 class="page-title">Банк слов</h1><p class="lede">Версии учебных значений, проверяемые переводы и явная аудитория по классам.</p></div><a class="button primary" th:href="@{/admin/vocabulary/items/new(setId=${selectedSetId})}">Добавить слово</a></div>
  <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  <section class="subpanel"><h2>Создать набор</h2><form class="form-grid quiz-basic-grid" method="post" th:action="@{/admin/vocabulary/sets}" th:object="${setForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label class="field"><span>Код</span><input th:field="*{code}" required maxlength="96" placeholder="english-basic"></label>
    <label class="field"><span>Язык слова</span><select th:field="*{sourceLanguage}"><option value="en">English</option><option value="kk">Қазақша</option><option value="ru">Русский</option></select></label><label class="field"><span>Язык перевода</span><select th:field="*{targetLanguage}"><option value="en">English</option><option value="ru">Русский</option><option value="kk">Қазақша</option></select></label>
    <label class="field"><span>Название RU</span><input th:field="*{titleRu}" required></label><label class="field"><span>Название KK</span><input th:field="*{titleKk}" required></label>
    <label class="field"><span>Проверяемый источник</span><input th:field="*{sourceReference}" required></label>
    <label class="field"><span><input type="checkbox" th:field="*{crossSetDistractorsAllowed}"> Разрешить межнаборные дистракторы</span></label><button class="button" type="submit">Создать набор</button>
  </form></section>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>Набор</th><th>Направление</th><th>Статус</th><th>Редакция</th><th>Действия</th></tr></thead><tbody>
  <tr th:each="set : ${sets}"><td><strong th:text="${set.publishedVersion != null ? set.publishedVersion.titleRu : (set.draftVersion != null ? set.draftVersion.titleRu : set.code)}"></strong><span class="muted-line" th:text="${set.code}"></span></td><td th:text="${set.sourceLanguage + ' → ' + set.targetLanguage}"></td><td><span class="badge" th:text="${set.status}"></span></td><td th:text="${set.draftVersion != null ? 'draft v' + set.draftVersion.versionNo : (set.publishedVersion != null ? 'v' + set.publishedVersion.versionNo : '—')}"></td><td class="row-actions"><a class="button" th:href="@{/admin/vocabulary/sets/{id}/edit(id=${set.id})}">Редактировать</a>
    <form th:if="${set.draftVersion != null and set.draftVersion.status.name() == 'DRAFT'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/submit(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">На проверку</button></form>
    <form th:if="${set.draftVersion != null and set.draftVersion.status.name() == 'NEEDS_REVIEW'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/approve(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">Одобрить</button></form>
    <form th:if="${set.draftVersion != null and set.draftVersion.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/publish(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary" type="submit">Опубликовать</button></form>
    <form th:if="${set.status.name() != 'ARCHIVED'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/archive(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger" type="submit">Архив</button></form>
  </td></tr></tbody></table></div>
  <hr class="divider"><form class="filter-bar" method="get"><label class="field compact"><span>Набор</span><select name="setId"><option value="">Любой</option><option th:each="set : ${sets}" th:value="${set.id}" th:selected="${set.id == selectedSetId}" th:text="${set.code}"></option></select></label><label class="field compact"><span>Язык слова</span><select name="sourceLanguage"><option value="">Любой</option><option value="en" th:selected="${selectedSourceLanguage == 'en'}">en</option><option value="kk" th:selected="${selectedSourceLanguage == 'kk'}">kk</option><option value="ru" th:selected="${selectedSourceLanguage == 'ru'}">ru</option></select></label><label class="field compact"><span>Язык перевода</span><select name="targetLanguage"><option value="">Любой</option><option value="en" th:selected="${selectedTargetLanguage == 'en'}">en</option><option value="ru" th:selected="${selectedTargetLanguage == 'ru'}">ru</option><option value="kk" th:selected="${selectedTargetLanguage == 'kk'}">kk</option></select></label><label class="field compact"><span>Класс</span><select name="gradeId"><option value="">Любой</option><option th:each="grade : ${grades}" th:value="${grade.id}" th:selected="${grade.id == selectedGradeId}" th:text="${grade.titleRu}"></option></select></label><label class="field compact"><span>Сложность</span><select name="difficulty"><option value="">Любая</option><option th:each="level : ${#numbers.sequence(1,5)}" th:value="${level}" th:selected="${level == selectedDifficulty}" th:text="${level}"></option></select></label><label class="field compact"><span>Статус</span><select name="status"><option value="">Любой</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${s}"></option></select></label><label class="field compact"><span>Поиск</span><input name="query" th:value="${query}" placeholder="Слово или перевод"></label><button class="button" type="submit">Показать</button></form>
  <form id="bulk-word-submit" method="post" th:action="@{/admin/vocabulary/items/bulk-submit}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form>
  <div class="table-wrap"><table class="data-table"><thead><tr><th></th><th>Слово</th><th>Перевод</th><th>Набор</th><th>Статус</th><th>Источник</th><th>Действия</th></tr></thead><tbody>
  <tr th:each="item : ${items}" th:with="v=${item.draftVersion != null ? item.draftVersion : item.publishedVersion}"><td><input th:if="${item.draftVersion != null and item.draftVersion.status.name() == 'DRAFT'}" form="bulk-word-submit" type="checkbox" name="itemIds" th:value="${item.id}" th:attr="aria-label=${'Выбрать слово ' + item.id}"></td><td><strong th:text="${v != null ? v.sourceText : '—'}"></strong><span class="muted-line" th:text="${v != null ? v.sourceNormalized : ''}"></span></td><td th:text="${v != null ? primaryAnswers[v.id] : '—'}"></td><td th:text="${item.set.code}"></td><td><span class="badge" th:text="${item.status}"></span><span class="badge warning" th:if="${item.draftVersion != null and item.publishedVersion != null}" th:text="${'draft v' + item.draftVersion.versionNo}"></span></td><td th:text="${v != null ? v.sourceReference : '—'}"></td><td class="row-actions"><a class="button" th:href="@{/admin/vocabulary/items/{id}/edit(id=${item.id})}">Открыть</a>
    <form th:if="${item.draftVersion != null and item.draftVersion.status.name() == 'NEEDS_REVIEW'}" method="post" th:action="@{/admin/vocabulary/items/{id}/approve(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">Одобрить</button></form>
    <form th:if="${item.draftVersion != null and item.draftVersion.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/vocabulary/items/{id}/publish(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary" type="submit">Опубликовать</button></form>
    <form th:if="${item.status.name() != 'ARCHIVED'}" method="post" th:action="@{/admin/vocabulary/items/{id}/archive(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger" type="submit">Архив</button></form>
  </td></tr></tbody></table></div><button class="button" type="submit" form="bulk-word-submit">Отправить выбранные на проверку</button>
</section></main></div></body></html>
