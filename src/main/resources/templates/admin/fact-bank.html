<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Банк утверждений</title><th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell admin-shell"><main class="page admin-layout"><aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside><section class="panel">
<div class="page-head"><div><h1 class="page-title">Банк утверждений</h1><p class="lede">Локализованные факты с boolean-ключом, объяснением, источником и явной аудиторией.</p></div><a class="button primary" th:href="@{/admin/facts/statements/new(setId=${selectedSetId})}">Добавить утверждение</a></div>
<div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<section class="subpanel"><h2>Создать набор</h2><form class="form-grid quiz-basic-grid" method="post" th:action="@{/admin/facts/sets}" th:object="${setForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="field"><span>Код</span><input th:field="*{code}" required maxlength="96"></label><label class="field"><span>Название RU</span><input th:field="*{titleRu}" required></label><label class="field"><span>Название KK</span><input th:field="*{titleKk}" required></label><label class="field"><span>Политика источников</span><input th:field="*{sourcePolicy}" required></label><button class="button" type="submit">Создать набор</button></form></section>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Набор</th><th>Статус</th><th>Политика источников</th><th>Действия</th></tr></thead><tbody><tr th:each="set : ${sets}"><td><strong th:text="${set.titleRu}"></strong><span class="muted-line" th:text="${set.code}"></span></td><td><span class="badge" th:text="${set.status}"></span></td><td th:text="${set.sourcePolicy}"></td><td class="row-actions">
<form th:if="${set.status.name() == 'DRAFT'}" method="post" th:action="@{/admin/facts/sets/{id}/submit(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">На проверку</button></form><form th:if="${set.status.name() == 'NEEDS_REVIEW'}" method="post" th:action="@{/admin/facts/sets/{id}/approve(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">Одобрить</button></form><form th:if="${set.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/facts/sets/{id}/publish(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary" type="submit">Опубликовать</button></form><form th:if="${set.status.name() != 'ARCHIVED'}" method="post" th:action="@{/admin/facts/sets/{id}/archive(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger" type="submit">Архив</button></form>
</td></tr></tbody></table></div>
<hr class="divider"><form class="filter-bar" method="get"><label class="field compact"><span>Набор</span><select name="setId"><option value="">Любой</option><option th:each="set : ${sets}" th:value="${set.id}" th:selected="${set.id == selectedSetId}" th:text="${set.titleRu}"></option></select></label><label class="field compact"><span>Класс</span><select name="gradeId"><option value="">Любой</option><option th:each="grade : ${grades}" th:value="${grade.id}" th:selected="${grade.id == selectedGradeId}" th:text="${grade.titleRu}"></option></select></label><label class="field compact"><span>Статус</span><select name="status"><option value="">Любой</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${s}"></option></select></label><label class="field compact"><span>Поиск</span><input name="query" th:value="${query}"></label><button class="button" type="submit">Показать</button></form>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Текст RU / KK</th><th>Ответ</th><th>Набор</th><th>Статус</th><th>Источник</th><th>Действия</th></tr></thead><tbody><tr th:each="statement : ${statements}" th:with="v=${statement.draftVersion != null ? statement.draftVersion : statement.publishedVersion}"><td><strong th:text="${v != null ? v.textRu : '—'}"></strong><span class="muted-line" th:text="${v != null ? v.textKk : ''}"></span></td><td th:text="${v != null ? (v.truthValue ? 'Истина' : 'Ложь') : '—'}"></td><td th:text="${statement.set.titleRu}"></td><td><span class="badge" th:text="${statement.status}"></span><span class="badge warning" th:if="${statement.publishedVersion != null and statement.draftVersion != null}" th:text="${'draft v' + statement.draftVersion.versionNo}"></span></td><td th:text="${v != null ? v.sourceReference : '—'}"></td><td class="row-actions"><a class="button" th:href="@{/admin/facts/statements/{id}/edit(id=${statement.id})}">Открыть</a><form th:if="${statement.draftVersion != null and statement.draftVersion.status.name() == 'DRAFT'}" method="post" th:action="@{/admin/facts/statements/{id}/submit(id=${statement.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">На проверку</button></form><form th:if="${statement.draftVersion != null and statement.draftVersion.status.name() == 'NEEDS_REVIEW'}" method="post" th:action="@{/admin/facts/statements/{id}/approve(id=${statement.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">Одобрить</button></form><form th:if="${statement.draftVersion != null and statement.draftVersion.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/facts/statements/{id}/publish(id=${statement.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary" type="submit">Опубликовать</button></form><form th:if="${statement.status.name() != 'ARCHIVED'}" method="post" th:action="@{/admin/facts/statements/{id}/archive(id=${statement.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger" type="submit">Архив</button></form></td></tr></tbody></table></div>
</section></main></div></body></html>
