<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Наборы слов</title><th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell admin-shell"><main class="page admin-layout">
<aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
<section class="panel quiz-admin-page">
  <div class="page-head"><div><h1 class="page-title">Наборы слов</h1><p class="lede">Создавайте наборы и управляйте их настройками. Слова каждого набора открываются отдельно.</p></div><a class="button" th:href="@{/admin/vocabulary/items}">Все слова</a></div>
  <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  <section class="subpanel"><h2>Создать набор</h2><form class="form-grid quiz-basic-grid" method="post" th:action="@{/admin/vocabulary/sets}" th:object="${setForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label class="field"><span>Код</span><input th:field="*{code}" required maxlength="96" placeholder="english-basic"></label>
    <label class="field"><span>Язык слова</span><select th:field="*{sourceLanguage}"><option value="en">English</option><option value="kk">Қазақша</option><option value="ru">Русский</option></select></label><label class="field"><span>Язык перевода</span><select th:field="*{targetLanguage}"><option value="en">English</option><option value="ru">Русский</option><option value="kk">Қазақша</option></select></label>
    <label class="field"><span>Название RU</span><input th:field="*{titleRu}" required></label><label class="field"><span>Название KK</span><input th:field="*{titleKk}" required></label>
    <label class="field"><span>Проверяемый источник</span><input th:field="*{sourceReference}" required></label>
    <label class="field"><span><input type="checkbox" th:field="*{crossSetDistractorsAllowed}"> Разрешить межнаборные дистракторы</span></label><button class="button" type="submit">Создать набор</button>
  </form></section>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>Набор</th><th>Направление</th><th>Статус</th><th>Редакция</th><th>Действия</th></tr></thead><tbody>
  <tr th:each="set : ${sets}"><td><strong th:text="${set.publishedVersion != null ? set.publishedVersion.titleRu : (set.draftVersion != null ? set.draftVersion.titleRu : set.code)}"></strong><span class="muted-line" th:text="${set.code}"></span></td><td th:text="${set.sourceLanguage + ' → ' + set.targetLanguage}"></td><td><span class="badge" th:text="${set.status}"></span></td><td th:text="${set.draftVersion != null ? 'draft v' + set.draftVersion.versionNo : (set.publishedVersion != null ? 'v' + set.publishedVersion.versionNo : '—')}"></td><td class="row-actions"><a class="button" th:href="@{/admin/vocabulary/items(setId=${set.id})}">Слова набора</a><a class="button" th:href="@{/admin/vocabulary/sets/{id}/edit(id=${set.id})}">Редактировать</a>
    <form th:if="${set.draftVersion != null and set.draftVersion.status.name() == 'DRAFT'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/submit(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">На проверку</button></form>
    <form th:if="${set.draftVersion != null and set.draftVersion.status.name() == 'NEEDS_REVIEW'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/approve(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">Одобрить</button></form>
    <form th:if="${set.draftVersion != null and set.draftVersion.status.name() == 'APPROVED'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/publish(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary" type="submit">Опубликовать</button></form>
    <form th:if="${set.status.name() != 'ARCHIVED'}" method="post" th:action="@{/admin/vocabulary/sets/{id}/archive(id=${set.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger" type="submit">Архив</button></form>
  </td></tr><tr th:if="${#lists.isEmpty(sets)}"><td colspan="5">Наборов пока нет. Создайте первый набор.</td></tr></tbody></table></div>
</section></main></div></body></html>
