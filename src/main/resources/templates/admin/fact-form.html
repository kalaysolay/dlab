<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Редакция утверждения</title><th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell admin-shell"><main class="page admin-layout"><aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside><section class="panel">
<div class="page-head"><div><h1 class="page-title" th:text="${editing ? 'Редакция утверждения' : 'Новое утверждение'}"></h1><p class="lede">False — полноценный правильный ответ. Для публикации обязательны оба текста, оба объяснения и источник.</p></div><a class="button" th:href="@{/admin/facts}">К банку</a></div><div class="alert danger" th:each="error : ${formErrors}" th:text="${error}"></div><div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
<div class="notice" th:if="${editing and statement.publishedVersion != null and statement.draftVersion != null}"><strong>Опубликованная версия не изменяется</strong><span>Форма сохраняет отдельную новую редакцию.</span></div>
<form class="form wide-form" method="post" th:object="${statementForm}" th:action="${editing} ? @{/admin/facts/statements/{id}(id=${statementId})} : @{/admin/facts/statements}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="field"><span>Набор</span><select th:field="*{setId}" required><option value="">Выберите</option><option th:each="set : ${sets}" th:value="${set.id}" th:text="${set.titleRu}"></option></select></label><div class="form-grid quiz-basic-grid"><label class="field"><span>Текст RU</span><textarea th:field="*{textRu}" rows="4" required></textarea></label><label class="field"><span>Текст KK</span><textarea th:field="*{textKk}" rows="4" required></textarea></label><label class="field"><span>Объяснение RU</span><textarea th:field="*{explanationRu}" rows="4" required></textarea></label><label class="field"><span>Объяснение KK</span><textarea th:field="*{explanationKk}" rows="4" required></textarea></label></div>
<fieldset class="subpanel"><legend>Правильный ответ</legend><label><input type="radio" th:field="*{truthValue}" value="true" required> Истина</label><label><input type="radio" th:field="*{truthValue}" value="false" required> Ложь</label></fieldset><label class="field"><span>Проверяемый источник</span><input th:field="*{sourceReference}" required></label>
<section class="subpanel"><h2>Аудитория</h2><label><input type="checkbox" th:field="*{universalAudience}"> Универсальное утверждение (явное решение редактора)</label><div class="row-actions"><label th:each="grade : ${grades}"><input type="checkbox" th:field="*{gradeIds}" th:value="${grade.id}"> <span th:text="${grade.titleRu}"></span></label></div><p class="muted-line">Пустой список классов не означает универсальность.</p></section><div class="actions"><button class="button primary" type="submit">Сохранить новую редакцию</button><a class="button" th:href="@{/admin/facts}">Отмена</a></div></form>
</section></main></div></body></html>
