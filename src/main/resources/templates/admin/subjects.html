<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Предметы</title>
    <th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell admin-shell">
    <main class="page admin-layout">
        <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
        <section class="panel subjects-admin-page">
            <div class="page-head">
                <div>
                    <h1 class="page-title">Предметы</h1>
                    <p class="lede">Названия, описания и иконки учебных предметов.</p>
                </div>
                <a class="button primary" th:href="@{/admin/subjects/new}">Создать предмет</a>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Пустое состояние помогает быстро перейти к созданию первого предмета. -->
            <div class="empty-state" th:if="${#lists.isEmpty(subjects)}">
                <strong>Предметов пока нет</strong>
                <span>Создайте предмет и затем добавьте к нему темы.</span>
            </div>

            <!-- Таблица показывает обе локализации и причину недоступного удаления. -->
            <div class="table-wrap" th:if="${!#lists.isEmpty(subjects)}">
                <table class="data-table subject-data-table">
                    <thead>
                    <tr>
                        <th>Иконка</th>
                        <th>Русский</th>
                        <th>Қазақша</th>
                        <th>Темы</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="subject : ${subjects}">
                        <td>
                            <img class="subject-admin-icon" th:if="${subject.iconUrl != null}"
                                 th:src="${subject.iconUrl}" alt="">
                            <span class="subject-admin-icon subject-admin-icon-placeholder"
                                  th:if="${subject.iconUrl == null}" aria-hidden="true">PNG</span>
                        </td>
                        <td>
                            <strong th:text="${subject.titleRu}">Математика</strong>
                            <span class="muted-line" th:text="${subject.descriptionRu}">Описание</span>
                        </td>
                        <td>
                            <strong th:text="${subject.titleKk}">Математика</strong>
                            <span class="muted-line" th:text="${subject.descriptionKk}">Сипаттама</span>
                        </td>
                        <td>
                            <span class="badge" th:text="${subject.topicCount}">0</span>
                        </td>
                        <td class="row-actions subject-row-actions">
                            <a class="button" th:href="@{/admin/subjects/{id}/edit(id=${subject.id})}">Редактировать</a>
                            <form method="post" th:if="${subject.canDelete()}"
                                  th:action="@{/admin/subjects/{id}/delete(id=${subject.id})}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="button danger" type="submit">Удалить</button>
                            </form>
                            <span class="muted-line" th:if="${!subject.canDelete()}">Удаление запрещено: есть темы</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
