<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block>
    <title>Продолжить в Damulab</title>
    <!-- Критичные стили встроены: переход не мигает голым HTML при ожидании внешней CSS. -->
    <style>
        body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#f5f7ff;color:#172033;font:16px/1.6 system-ui,sans-serif}
        main{width:min(360px,calc(100% - 48px));text-align:center;padding:32px 0}img{width:72px;height:72px}h1{font-size:24px;margin:20px 0 8px}p{color:#64748b;margin:0 0 24px}a{display:block;padding:14px 20px;border-radius:14px;background:#4f46e5;color:white;text-decoration:none;font-weight:700}
    </style>
</head>
<body th:attr="data-pwa-entry-home=${entryHome}">
<main>
    <img src="/icons/damulab-icon.svg" alt="Damulab">
    <h1>С возвращением!</h1>
    <p>Возвращаемся к вашему занятию</p>
    <a th:href="${entryHome}">Продолжить</a>
</main>
<script src="/js/pwa-resume.js?v=1"></script>
</body>
</html>
