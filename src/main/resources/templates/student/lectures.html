<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{student.lectures.title}">Уроки</title>
    <th:block th:replace="~{fragments/pwa-head :: pwaHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <!-- На всех ученических страницах используем единый хедер с логотипом и меню. -->
    <header th:replace="~{fragments/student-header :: studentHeader}"></header>
    <main class="page student-lecture-catalog">
        <section class="panel">
            <div class="page-head">
                <div>
                    <p class="section-kicker" th:text="#{student.lectures.kicker}">Материалы</p>
                    <h1 class="page-title" th:text="#{student.lectures.heading}">Выберите предмет</h1>
                    <p class="lede" th:text="#{student.lectures.lede}">Читайте уроки и закрепляйте знания.</p>
                </div>
                <a class="button" th:href="@{/student}" th:text="#{student.lectures.back}">В кабинет</a>
            </div>

            <!-- Предмет без опубликованных лекций не показывается, поэтому пустое состояние честное. -->
            <div class="empty-state" th:if="${#lists.isEmpty(lectureSubjects)}">
                <strong th:text="#{student.lectures.empty.title}">Уроки пока не опубликованы</strong>
                <span th:text="#{student.lectures.empty.body}">Методист готовит первые материалы.</span>
            </div>

            <!-- На широком экране сетка содержит ровно три предмета в строке. -->
            <div class="lecture-subject-grid" th:if="${!#lists.isEmpty(lectureSubjects)}">
                <a class="lecture-subject-card"
                   th:each="subject : ${lectureSubjects}"
                   th:href="@{/student/lectures/subjects/{id}(id=${subject.id})}">
                    <!-- Настроенная в админке иконка заменяет стандартную заглушку. -->
                    <img class="lecture-subject-placeholder lecture-subject-icon"
                         th:if="${subject.iconUrl() != null}" th:src="${subject.iconUrl()}" alt="">
                    <span class="lecture-subject-placeholder" th:if="${subject.iconUrl() == null}" aria-hidden="true">
                        <svg class="lucide-icon"><use th:href="@{/icons/lucide-sprite.svg#book-open-check}"></use></svg>
                    </span>
                    <span class="lecture-subject-copy">
                        <strong th:text="${#locale.language == 'kk' ? subject.titleKk : subject.titleRu}">Математика</strong>
                        <small th:text="#{student.lectures.count(${subject.lectureCount})}">1 урок</small>
                    </span>
                    <span class="chev" aria-hidden="true">›</span>
                </a>
            </div>
        </section>
    </main>
</div>
</body>
</html>
