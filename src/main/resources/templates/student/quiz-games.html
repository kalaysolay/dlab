<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/quiz-ui-head :: head}"></head><body><div class="app-shell">
<header th:replace="~{fragments/student-header :: studentHeader}"></header>
<main class="page qg-page qg-catalog-page" data-quiz-catalog data-quiz-join data-quick-join>
    <section class="qg-catalog-hero">
        <div class="qg-catalog-copy"><span class="qg-eyebrow" th:text="#{quiz.ui.practice}"></span>
            <h1 th:text="#{quiz.ui.catalogHero}"></h1></div>
        <a class="qg-custom-action" th:href="@{/student/quiz/create}">
            <span class="qg-custom-action-icon"><svg class="lucide-icon" aria-hidden="true"><use th:href="@{/icons/lucide-sprite.svg#clipboard-check}"></use></svg></span>
            <span><strong th:text="#{quiz.ui.customAction}"></strong><small th:text="#{quiz.ui.customActionHint}"></small></span>
        </a>
    </section>
    <section class="qg-join-inline" aria-labelledby="qg-join-title">
        <div><h2 id="qg-join-title" th:text="#{quiz.ui.joinInline}"></h2><p th:text="#{quiz.ui.joinInlineHint}"></p></div>
        <form id="qg-code-form" class="qg-code-form">
            <label class="qg-sr" for="qg-code" th:text="#{quiz.ui.code}"></label>
            <input id="qg-code" name="code" maxlength="32" required autocomplete="off" autocapitalize="characters" spellcheck="false"
                   th:value="${joinCode}" aria-describedby="qg-error" placeholder="QZ7K2M">
            <button class="button primary" type="submit" th:text="#{quiz.ui.enter}"></button>
        </form>
        <p id="qg-error" role="alert" class="qg-error" tabindex="-1"></p>
        <section id="qg-preview" class="qg-join-preview" hidden aria-live="polite"><h3 id="qg-preview-title" tabindex="-1"></h3><p id="qg-preview-meta"></p><p id="qg-preview-blocker"></p></section>
    </section>
    <p class="alert error" role="alert" th:if="${error}" th:text="${error}"></p>
    <section class="panel" th:if="${cards.isEmpty()}"><h2 th:text="#{quiz.ui.empty}"></h2><a class="button" th:href="@{/student}" th:text="#{quiz.ui.back}"></a></section>
    <section class="qg-popular" th:if="${!cards.isEmpty()}" th:aria-label="#{quiz.ui.popular}">
        <h2 th:text="#{quiz.ui.popular}"></h2>
        <div class="qg-type-grid">
        <form th:each="card, iter : ${cards}" class="qg-type-card" th:action="@{/student/quiz/games/rooms}" method="post" data-create-game>
            <input type="hidden" name="gameCode" th:value="${card.code}"><input type="hidden" name="idempotencyKey" th:value="${card.key}">
            <div class="qg-type-card-top"><span class="qg-type-label" th:text="${quizLabels[card.type]}"></span>
                <span class="qg-type-number" th:text="${iter.count < 10 ? '0' + iter.count : iter.count}"></span></div>
            <!-- Название и описание всегда приходят из публикации игры, а не из шаблона. -->
            <div class="qg-type-card-copy"><h3 th:text="${card.title}"></h3><p th:text="${card.description}"></p>
                <p class="qg-mechanic" th:if="${!#strings.isEmpty(card.mechanic)}" th:text="${card.mechanic}"></p></div>
            <div class="qg-type-card-meta"><span th:text="${quizLabels['rounds'] + ': ' + card.count}"></span><span th:text="${quizLabels['seconds'] + ': ' + card.seconds}"></span>
                <span th:text="${quizLabels['players'] + ': 1–' + card.maxPlayers}"></span></div>
            <label class="field qg-type-grade" th:if="${card.gradeMode != 'NONE'}"><span th:text="#{quiz.ui.grade}"></span>
                <select name="gradeId" required th:aria-describedby="${'reason-'+card.code}"><option value="" th:text="#{quiz.ui.chooseGrade}"></option>
                    <option th:each="grade : ${card.grades}" th:value="${grade.id}" th:text="${grade.title}" th:selected="${grade.id == card.selectedGradeId}" th:disabled="${grade.blocker != null}"></option></select></label>
            <button type="submit" class="qg-type-play" th:disabled="${card.blocker != null}" th:aria-describedby="${'reason-'+card.code}" th:text="#{quiz.ui.play}"></button>
            <p th:id="${'reason-'+card.code}" class="qg-reason" th:text="${card.blocker == null ? '' : quizLabels[card.blocker]}"></p>
            <a class="qg-profile-link" th:if="${card.blocker == 'PROFILE_GRADE_REQUIRED' or card.blocker == 'INVALID_GRADE'}" th:href="@{/student/profile}" th:text="#{quiz.ui.profile}"></a>
        </form>
        </div>
    </section>
</main></div></body></html>
