spring:
  thymeleaf:
    cache: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

damulab:
  demo-users:
    enabled: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # В production JSESSIONID передаётся только по HTTPS.
        secure: true

logging:
  level:
    kz.damulab: INFO
    org.springframework.security: WARN
