spring:
  application:
    name: damulab
  profiles:
    default: local
  thymeleaf:
    cache: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # За nginx/Caddy: учитывать X-Forwarded-Proto/Host, чтобы редиректы шли на https://
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Мини-лекция и AI: при генерации смотрите консоль — INFO от kz.damulab.ai и QuestionBankService.
# Сырой JSON от модели — только при DEBUG (см. application-local.yml: kz.damulab: DEBUG).
logging:
  level:
    kz.damulab.ai: INFO
    kz.damulab.questions.QuestionBankService: INFO

damulab:
  questions:
    images:
      # Иллюстрации внутри HTML вопроса не смешиваются с файлами лекций.
      storage-dir: ${QUESTION_IMAGES_STORAGE_DIR:uploads/question-images}
  # Подтверждение аккаунта через HTTP API SMTP.BZ. При enabled=false новые аккаунты
  # активируются сразу; при true обязательны API-ключ, подтверждённый адрес отправителя
  # и публичный HTTPS-адрес приложения.
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:1m}
    api-base-url: ${EMAIL_API_BASE_URL:https://api.smtp.bz/v1}
    api-key: ${EMAIL_API_KEY:}
    from: ${EMAIL_FROM:}
    sender-name: ${EMAIL_SENDER_NAME:Damulab}
  testing:
    default-question-count: 12
    max-question-count: 20
    min-published-per-subject-grade: 1
  ui:
    server-time-zone: Asia/Almaty
  # Web Push / VAPID: при пустых ключах активируется StubPushProvider (без реальных уведомлений).
  # Генерация ключей: npx web-push generate-vapid-keys
  # VAPID_PUBLIC_KEY — Base64url EC public key; передаётся клиенту для PushManager.subscribe().
  # VAPID_PRIVATE_KEY — Base64url EC private key; используется только на сервере.
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@damulab.kz}
    # Интервал опроса очереди push-уведомлений (мс)
    worker-delay-ms: 60000
  passkeys:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: ${WEBAUTHN_RP_NAME:Damulab.kz}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080}
  # Провайдер и модель выбираются в /admin/settings/ai и хранятся в ai_runtime_settings.
  # В конфиге остаются только endpoint-ы, секреты и аварийный выключатель внешних запросов.
  ai:
    real-providers-enabled: ${AI_REAL_PROVIDERS_ENABLED:true}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
