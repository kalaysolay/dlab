<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Удивительные факты — Damulab</title>
    <link rel="stylesheet" href="../../../src/main/resources/static/css/fonts.css">
    <link rel="stylesheet" href="../../../src/main/resources/static/css/app.css">
    <link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="app-shell">
    <header class="student-header compact-student-header"><div class="student-header-row"><a class="brand brand-link" href="index.html"><span class="brand-mark"><svg class="lucide-icon"><use href="../../../src/main/resources/static/icons/lucide-sprite.svg#sparkles"></use></svg></span><span class="brand-copy"><strong>Damulab.kz</strong><small>Мой путь развития</small></span></a><a class="button" href="index.html">Выйти из игры</a></div></header>
    <main class="page quiz-flow-page">
        <section class="panel game-shell" data-game="facts">
            <div class="game-topbar"><div class="game-label"><strong data-game-label>Удивительные факты</strong><span>Верю / не верю</span></div><div class="game-progress-track"><span data-game-progress></span></div><span class="game-progress-copy" data-game-progress-copy>1 из 8</span></div>
            <div class="game-question-stage">
                <div><div class="game-meta"><span class="game-tag" data-game-topic>Животные</span></div><h1 class="game-question subject-question fact-question" data-game-question>У осьминога три сердца.</h1></div>
                <div class="game-timer" data-game-timer><div><strong>12</strong><span>секунд</span></div></div>
            </div>
            <div class="game-answer-grid true-false-grid" data-game-answers></div>
            <p class="game-feedback" data-game-feedback hidden></p>
            <div class="game-footer"><span class="game-footer-copy">Выберите один ответ</span><div class="actions"><button class="button" type="button" data-game-skip>Пропустить</button><button class="button primary" type="button" data-game-submit disabled>Ответить</button></div></div>
        </section>
    </main>
</div>
<script src="prototype.js"></script>
</body>
</html>
